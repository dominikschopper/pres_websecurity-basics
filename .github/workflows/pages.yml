name: Deploy slides to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      # Assemble only what the browser needs; paths stay identical to local use.
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/reveal.js/dist
          cp *.html _site/
          cp -r css slides js plugin assets _site/
          cp -r node_modules/reveal.js/dist/* _site/node_modules/reveal.js/dist/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
